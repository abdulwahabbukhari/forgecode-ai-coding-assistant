openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: AI coding assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [assistant]
      summary: Send a coding question to the AI assistant
      description: Sends a conversation, project context or multimodal attachment to WAHAB AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
      required:
        - role
        - content
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ChatMessage"
        code:
          type: ["string", "null"]
          maxLength: 20000
        language:
          type: ["string", "null"]
          maxLength: 40
        mode:
          type: string
          enum: [chat, image]
        pdfText:
          type: ["string", "null"]
          maxLength: 60000
        projectFiles:
          type: array
          maxItems: 80
          items:
            type: object
            properties:
              path:
                type: string
                maxLength: 240
              content:
                type: string
                maxLength: 18000
            required: [path, content]
        attachments:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 240
              type:
                type: string
                maxLength: 100
              data:
                type: string
                maxLength: 8000000
            required: [name, type, data]
      required:
        - messages
    ChatResponse:
      type: object
      properties:
        message:
          type: string
        model:
          type: string
        demo:
          type: boolean
      required:
        - message
        - model
        - demo
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

